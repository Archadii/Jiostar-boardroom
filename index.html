<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jiostar Immersive Experience</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">

<style>
body{
 margin:0;
 background:#050507;
 color:white;
 font-family:'Inter',sans-serif;
 overflow-x:hidden;
}

canvas{display:block;}

nav{
 position:fixed;
 top:0;
 width:100%;
 padding:20px 40px;
 display:flex;
 justify-content:space-between;
 backdrop-filter:blur(10px);
 background:rgba(0,0,0,0.35);
 z-index:20;
}

.logo-text{
 font-weight:800;
 font-size:18px;
 letter-spacing:1px;
}

.overlay-title{
 position:fixed;
 top:50%;
 width:100%;
 text-align:center;
 transform:translateY(-50%);
 transition:opacity 0.5s ease;
 pointer-events:none;
}

.overlay-title h1{
 font-size:4vw;
 margin:0;
}

.info-panel{
 position:fixed;
 bottom:-100%;
 left:0;
 width:100%;
 height:60%;
 background:rgba(0,0,0,0.92);
 backdrop-filter:blur(20px);
 padding:50px;
 box-sizing:border-box;
 transition:bottom 0.5s ease;
 z-index:30;
}

.info-panel.active{
 bottom:0;
}

.close-btn{
 position:absolute;
 top:20px;
 right:30px;
 cursor:pointer;
}

.fallback{
 position:fixed;
 top:50%;
 left:50%;
 transform:translate(-50%,-50%);
 text-align:center;
}

body{height:400vh;}
</style>
</head>

<body>

<nav>
<div class="logo-text">JIOSTAR</div>
</nav>

<div class="overlay-title" id="heroTitle">
<h1>India’s Biggest Storytellers</h1>
</div>

<div class="info-panel" id="infoPanel">
<div class="close-btn" onclick="closePanel()">Close ✕</div>
<h2 id="panelTitle"></h2>
<p>Lorem ipsum dolor sit amet, consectetur adipiscing elit. Sed do eiusmod tempor incididunt ut labore et dolore magna aliqua.</p>
</div>

<div id="fallback" class="fallback" style="display:none;">
<p>Your device does not support WebGL.</p>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.152.2/build/three.min.js"></script>
<script>

(function(){

if(!window.WebGLRenderingContext){
 document.getElementById("fallback").style.display="block";
 return;
}

const PINK = 0xff007f;

let scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x050507,40,150);

let camera = new THREE.PerspectiveCamera(
 60,
 window.innerWidth/window.innerHeight,
 0.1,
 1000
);
camera.position.z = 70;

let renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
renderer.setSize(window.innerWidth,window.innerHeight);
document.body.appendChild(renderer.domElement);

/* Lighting */
scene.add(new THREE.AmbientLight(0xffffff,0.5));
let light = new THREE.PointLight(PINK,1.8);
light.position.set(20,20,20);
scene.add(light);

/* Particles */
const particleCount = 800;
let particleGeo = new THREE.BufferGeometry();
let positions = new Float32Array(particleCount*3);
let radii = new Float32Array(particleCount);

for(let i=0;i<particleCount;i++){
 let angle=Math.random()*Math.PI*2;
 let radius=40+Math.random()*25;
 let height=(Math.random()-0.5)*50;
 positions[i*3]=Math.cos(angle)*radius;
 positions[i*3+1]=height;
 positions[i*3+2]=Math.sin(angle)*radius;
 radii[i]=radius;
}

particleGeo.setAttribute("position",new THREE.BufferAttribute(positions,3));

let particleMat = new THREE.PointsMaterial({
 color:PINK,
 size:1.4,
 transparent:true,
 opacity:0.85,
 depthWrite:false
});

let particles = new THREE.Points(particleGeo,particleMat);
scene.add(particles);

/* Panels */
let panels=[];
function createPanel(text,x,z){
 let geo=new THREE.BoxGeometry(18,9,1);
 let mat=new THREE.MeshPhysicalMaterial({
  color:0x111111,
  metalness:0.6,
  roughness:0.15,
  transmission:0.85,
  transparent:true,
  opacity:0.95
 });

 let mesh=new THREE.Mesh(geo,mat);
 mesh.position.set(x,0,z);
 mesh.userData.title=text;
 scene.add(mesh);

 let canvas=document.createElement("canvas");
 canvas.width=1024;
 canvas.height=512;
 let ctx=canvas.getContext("2d");
 ctx.fillStyle="#000";
 ctx.fillRect(0,0,1024,512);
 ctx.fillStyle="#ff007f";
 ctx.font="bold 80px Inter";
 ctx.textAlign="center";
 ctx.fillText(text,512,280);

 mat.map=new THREE.CanvasTexture(canvas);

 panels.push(mesh);
}

createPanel("Entertainment",-22,-40);
createPanel("Sports",0,-60);
createPanel("Culture",22,-80);

/* Interaction */
let raycaster=new THREE.Raycaster();
let mouse=new THREE.Vector2();
let hovered=null;
let zoomed=false;

function onMouseMove(e){
 if(zoomed) return;

 mouse.x=(e.clientX/window.innerWidth)*2-1;
 mouse.y=-(e.clientY/window.innerHeight)*2+1;

 raycaster.setFromCamera(mouse,camera);
 let intersects=raycaster.intersectObjects(panels);

 if(intersects.length>0){
  if(hovered!==intersects[0].object){
   hovered=intersects[0].object;
   document.body.style.cursor="pointer";
  }
 }else{
  hovered=null;
  document.body.style.cursor="default";
 }

 camera.rotation.y=mouse.x*0.12;
 camera.rotation.x=-mouse.y*0.05;
}

function onClick(){
 if(!hovered||zoomed) return;

 zoomed=true;
 document.body.style.overflow="hidden";

 let target=hovered.position;

 camera.position.set(target.x,target.y,target.z+14);

 document.getElementById("panelTitle").innerText=hovered.userData.title;
 document.getElementById("infoPanel").classList.add("active");
}

window.addEventListener("mousemove",onMouseMove);
window.addEventListener("click",onClick);

window.closePanel=function(){
 zoomed=false;
 document.body.style.overflow="auto";
 document.getElementById("infoPanel").classList.remove("active");
 camera.position.set(0,0,70);
};

/* Scroll */
let targetZ=70;
window.addEventListener("scroll",()=>{
 if(!zoomed){
  targetZ=70-window.scrollY*0.05;
 }
});

/* Animation Loop */
function animate(){
 requestAnimationFrame(animate);

 if(!zoomed){
  camera.position.z+= (targetZ-camera.position.z)*0.08;
 }

 let pos=particles.geometry.attributes.position.array;
 let time=performance.now()*0.00012;

 for(let i=0;i<particleCount;i++){
  let angle=time+i;
  pos[i*3]=Math.cos(angle*0.2)*radii[i];
  pos[i*3+2]=Math.sin(angle*0.2)*radii[i];
 }
 particles.geometry.attributes.position.needsUpdate=true;

 renderer.render(scene,camera);
}
animate();

/* Resize */
let resizeTimeout;
window.addEventListener("resize",()=>{
 clearTimeout(resizeTimeout);
 resizeTimeout=setTimeout(()=>{
  renderer.setSize(window.innerWidth,window.innerHeight);
  camera.aspect=window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
 },150);
});

})();
</script>

</body>
</html>
