<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jiostar – Immersive Brand Experience</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">

<style>
body{
 margin:0;
 font-family:'Inter',sans-serif;
 background:#050507;
 color:white;
 overflow-x:hidden;
}

canvas{display:block;}

nav{
 position:fixed;
 top:0;
 width:100%;
 padding:20px 40px;
 display:flex;
 justify-content:space-between;
 align-items:center;
 backdrop-filter:blur(10px);
 background:rgba(0,0,0,0.35);
 z-index:20;
}

nav a{
 color:white;
 text-decoration:none;
 margin-left:20px;
 font-size:14px;
}

.logo-text{
 font-weight:800;
 letter-spacing:1px;
}

.overlay-hero{
 position:fixed;
 top:50%;
 width:100%;
 transform:translateY(-50%);
 text-align:center;
 pointer-events:none;
 transition:opacity 0.6s ease;
}

.overlay-hero h1{
 font-size:4vw;
 margin:0;
}

.section-overlay{
 position:fixed;
 right:40px;
 top:120px;
 width:320px;
 background:rgba(0,0,0,0.75);
 backdrop-filter:blur(20px);
 padding:25px;
 box-sizing:border-box;
 border:1px solid rgba(255,255,255,0.05);
 display:none;
 z-index:30;
}

.section-overlay.active{
 display:block;
}

.section-overlay h2{
 margin-top:0;
}

.close-btn{
 position:absolute;
 top:10px;
 right:15px;
 cursor:pointer;
 font-size:12px;
}

footer{
 position:relative;
 padding:80px 40px;
 text-align:center;
 background:#0a0a0f;
 margin-top:200vh;
}

body{height:500vh;}
</style>
</head>

<body>

<nav>
<div class="logo-text">JIOSTAR</div>
<div>
<a href="#">About</a>
<a href="#">Story Engine</a>
<a href="#">Distribution</a>
<a href="#">Contact</a>
</div>
</nav>

<div class="overlay-hero" id="heroTitle">
<h1>India’s Biggest Storytellers</h1>
<p>Entertainment • Sports • Culture</p>
</div>

<div class="section-overlay" id="infoPanel">
<div class="close-btn" onclick="closePanel()">Close ✕</div>
<h2 id="panelTitle"></h2>
<p id="panelContent"></p>
</div>

<footer>
<p>© 2026 Jiostar. Immersive Brand Prototype.</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/three@0.152.2/build/three.min.js"></script>

<script>

(function(){

if(!window.WebGLRenderingContext){
 alert("WebGL not supported on this device.");
 return;
}

const PINK = 0xff007f;

/* Scene */
let scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x050507,40,160);

let camera = new THREE.PerspectiveCamera(60,window.innerWidth/window.innerHeight,0.1,1000);
camera.position.z = 80;

let renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
renderer.setSize(window.innerWidth,window.innerHeight);
document.body.appendChild(renderer.domElement);

/* Lighting */
scene.add(new THREE.AmbientLight(0xffffff,0.5));
let light = new THREE.PointLight(PINK,1.5);
light.position.set(30,30,30);
scene.add(light);

/* Particles */
const particleCount = 700;
let geo = new THREE.BufferGeometry();
let positions = new Float32Array(particleCount*3);
let radii = new Float32Array(particleCount);

for(let i=0;i<particleCount;i++){
 let angle=Math.random()*Math.PI*2;
 let radius=40+Math.random()*30;
 let height=(Math.random()-0.5)*60;
 positions[i*3]=Math.cos(angle)*radius;
 positions[i*3+1]=height;
 positions[i*3+2]=Math.sin(angle)*radius;
 radii[i]=radius;
}
geo.setAttribute("position",new THREE.BufferAttribute(positions,3));

let mat = new THREE.PointsMaterial({
 color:PINK,
 size:1.5,
 transparent:true,
 opacity:0.85,
 depthWrite:false
});

let particles = new THREE.Points(geo,mat);
scene.add(particles);

/* Panels */
let panels=[];
const panelData = [
 {title:"Entertainment",content:"Jiostar delivers premium entertainment narratives across formats, genres and platforms, shaping cultural conversation at scale."},
 {title:"Sports",content:"From marquee cricket properties to live sporting moments, Jiostar connects millions through high-impact sports storytelling."},
 {title:"Culture",content:"Jiostar builds culturally resonant formats that reflect India’s evolving identity across language, region and audience segments."}
];

function createPanel(data,x,z){
 let box=new THREE.BoxGeometry(20,10,1);
 let material=new THREE.MeshPhysicalMaterial({
  color:0x111111,
  metalness:0.6,
  roughness:0.15,
  transmission:0.85,
  transparent:true,
  opacity:0.95
 });

 let mesh=new THREE.Mesh(box,material);
 mesh.position.set(x,0,z);
 mesh.userData=data;
 scene.add(mesh);

 let canvas=document.createElement("canvas");
 canvas.width=1024;
 canvas.height=512;
 let ctx=canvas.getContext("2d");
 ctx.fillStyle="#000";
 ctx.fillRect(0,0,1024,512);
 ctx.fillStyle="#ff007f";
 ctx.font="bold 80px Inter";
 ctx.textAlign="center";
 ctx.fillText(data.title,512,280);

 material.map=new THREE.CanvasTexture(canvas);

 panels.push(mesh);
}

createPanel(panelData[0],-25,-50);
createPanel(panelData[1],0,-70);
createPanel(panelData[2],25,-90);

/* Interaction */
let raycaster=new THREE.Raycaster();
let mouse=new THREE.Vector2();
let hovered=null;
let zoomed=false;

window.addEventListener("mousemove",(e)=>{
 if(zoomed) return;

 mouse.x=(e.clientX/window.innerWidth)*2-1;
 mouse.y=-(e.clientY/window.innerHeight)*2+1;

 raycaster.setFromCamera(mouse,camera);
 let intersects=raycaster.intersectObjects(panels);

 if(intersects.length>0){
  hovered=intersects[0].object;
  document.body.style.cursor="pointer";
 }else{
  hovered=null;
  document.body.style.cursor="default";
 }

 camera.rotation.y=mouse.x*0.12;
 camera.rotation.x=-mouse.y*0.05;
});

window.addEventListener("click",()=>{
 if(!hovered||zoomed) return;

 zoomed=true;
 document.body.style.overflow="hidden";

 let target=hovered.position;
 camera.position.set(target.x,target.y,target.z+14);

 document.getElementById("panelTitle").innerText=hovered.userData.title;
 document.getElementById("panelContent").innerText=hovered.userData.content;
 document.getElementById("infoPanel").classList.add("active");
});

window.closePanel=function(){
 zoomed=false;
 document.body.style.overflow="auto";
 document.getElementById("infoPanel").classList.remove("active");
 camera.position.set(0,0,80);
};

/* Scroll */
let targetZ=80;
window.addEventListener("scroll",()=>{
 if(!zoomed){
  targetZ=80-window.scrollY*0.05;
 }
});

/* Animate */
function animate(){
 requestAnimationFrame(animate);

 if(!zoomed){
  camera.position.z+=(targetZ-camera.position.z)*0.08;
 }

 let pos=particles.geometry.attributes.position.array;
 let time=performance.now()*0.00012;
 for(let i=0;i<particleCount;i++){
  let angle=time+i;
  pos[i*3]=Math.cos(angle*0.2)*radii[i];
  pos[i*3+2]=Math.sin(angle*0.2)*radii[i];
 }
 particles.geometry.attributes.position.needsUpdate=true;

 renderer.render(scene,camera);
}
animate();

/* Resize */
window.addEventListener("resize",()=>{
 renderer.setSize(window.innerWidth,window.innerHeight);
 camera.aspect=window.innerWidth/window.innerHeight;
 camera.updateProjectionMatrix();
});

})();
</script>

</body>
</html>
