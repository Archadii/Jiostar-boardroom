 <!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jiostar Immersive Environment</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;500;700&display=swap" rel="stylesheet">

<style>
body {
  margin:0;
  overflow-x:hidden;
  background:#050507;
  color:white;
  font-family:'Inter', sans-serif;
}

canvas { display:block; }

nav {
  position:fixed;
  top:0;
  width:100%;
  padding:20px 40px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  backdrop-filter:blur(8px);
  background:rgba(0,0,0,0.35);
  z-index:10;
}

nav img { height:40px; }

.overlay {
  position:fixed;
  top:50%;
  width:100%;
  transform:translateY(-50%);
  text-align:center;
  pointer-events:none;
}

.overlay h1 {
  font-size:4vw;
  font-weight:700;
}

.overlay p {
  margin-top:15px;
  opacity:0.7;
}

body { height:400vh; }
</style>
</head>

<body>

<nav>
  <img src="https://www.jiostar.com/assets/images/logo.svg">
</nav>

<div class="overlay">
  <h1>India’s Biggest Storytellers</h1>
  <p>Entertainment • Sports • Culture</p>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.152.2/build/three.min.js"></script>

<script>

const PINK = 0xff007f;

// Scene
let scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x050507, 30, 140);

// Camera
let camera = new THREE.PerspectiveCamera(
  60,
  window.innerWidth / window.innerHeight,
  0.1,
  1000
);
camera.position.z = 60;

// Renderer
let renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);
document.body.appendChild(renderer.domElement);

// Lighting
let ambient = new THREE.AmbientLight(0xffffff, 0.5);
scene.add(ambient);

let light = new THREE.PointLight(PINK, 2);
light.position.set(20,20,20);
scene.add(light);

// Soft Curved Particle System
let particleCount = 1500;
let geometry = new THREE.BufferGeometry();
let positions = new Float32Array(particleCount * 3);
let radii = [];

for (let i = 0; i < particleCount; i++) {

  let angle = Math.random() * Math.PI * 2;
  let radius = 30 + Math.random() * 40;
  let height = (Math.random() - 0.5) * 50;

  positions[i*3] = Math.cos(angle) * radius;
  positions[i*3+1] = height;
  positions[i*3+2] = Math.sin(angle) * radius;

  radii.push(radius);
}

geometry.setAttribute(
  'position',
  new THREE.BufferAttribute(positions, 3)
);

let material = new THREE.PointsMaterial({
  color: PINK,
  size: 1.2,
  transparent: true,
  opacity: 0.85,
  depthWrite: false
});

let particles = new THREE.Points(geometry, material);
scene.add(particles);

// Glass Panel Creator
function createGlassPanel(text, x, z) {

  let geo = new THREE.BoxGeometry(20, 10, 1);

  let mat = new THREE.MeshPhysicalMaterial({
    color:0x111111,
    metalness:0.6,
    roughness:0.1,
    transmission:0.9,
    thickness:1,
    transparent:true,
    opacity:0.95
  });

  let mesh = new THREE.Mesh(geo, mat);
  mesh.position.set(x, 0, z);
  scene.add(mesh);

  let canvas = document.createElement("canvas");
  canvas.width = 1024;
  canvas.height = 512;
  let ctx = canvas.getContext("2d");

  ctx.fillStyle="#000";
  ctx.fillRect(0,0,1024,512);
  ctx.fillStyle="#ff007f";
  ctx.font="bold 90px Inter";
  ctx.textAlign="center";
  ctx.fillText(text,512,280);

  let texture = new THREE.CanvasTexture(canvas);
  mat.map = texture;

  return mesh;
}

let panel1 = createGlassPanel("Entertainment", -25, -20);
let panel2 = createGlassPanel("Sports", 0, -40);
let panel3 = createGlassPanel("Culture", 25, -60);

// Scroll-driven depth
window.addEventListener("scroll", () => {
  let scrollY = window.scrollY;
  camera.position.z = 60 - scrollY * 0.05;
});

// Mouse parallax
document.addEventListener("mousemove", (e) => {
  let x = (e.clientX / window.innerWidth - 0.5) * 2;
  let y = (e.clientY / window.innerHeight - 0.5) * 2;
  camera.rotation.y = x * 0.2;
  camera.rotation.x = -y * 0.1;
});

// Particle animation
function animateParticles() {

  let pos = particles.geometry.attributes.position.array;

  for (let i = 0; i < particleCount; i++) {
    let angle = performance.now() * 0.00015 + i;
    pos[i*3] = Math.cos(angle * 0.2) * radii[i];
    pos[i*3+2] = Math.sin(angle * 0.2) * radii[i];
  }

  particles.geometry.attributes.position.needsUpdate = true;
}

// Animation loop
function animate() {
  requestAnimationFrame(animate);
  animateParticles();
  renderer.render(scene, camera);
}
animate();

// Resize
window.addEventListener("resize", () => {
  renderer.setSize(window.innerWidth, window.innerHeight);
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
});

</script>

</body>
</html>
