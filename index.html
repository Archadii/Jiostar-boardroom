<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jiostar Immersive Environment</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;500;700&display=swap" rel="stylesheet">

<style>
body { margin:0; overflow-x:hidden; font-family:'Inter',sans-serif; background:#000; color:white; }
canvas { display:block; }

nav {
 position:fixed;
 top:0;
 width:100%;
 padding:20px 50px;
 display:flex;
 justify-content:space-between;
 align-items:center;
 backdrop-filter:blur(10px);
 background:rgba(0,0,0,0.4);
 z-index:10;
}

nav img { height:40px; }

nav ul { display:flex; gap:30px; list-style:none; }
nav ul li { cursor:pointer; font-weight:500; }

.overlay-section {
 position:fixed;
 width:100%;
 top:50%;
 transform:translateY(-50%);
 text-align:center;
 pointer-events:none;
 transition:opacity 0.6s ease;
}

.overlay-section h1 {
 font-size:4vw;
 font-weight:700;
}

.overlay-section p {
 margin-top:20px;
 opacity:0.7;
}

.metric {
 position:fixed;
 bottom:10%;
 width:100%;
 text-align:center;
 font-size:2vw;
 opacity:0;
 transition:opacity 0.6s ease;
}

</style>
</head>
<body>

<nav>
<img src="https://www.jiostar.com/assets/images/logo.svg">
<ul>
<li>About</li>
<li>Story Engine</li>
<li>Distribution</li>
<li>Brand Lab</li>
<li>Vision</li>
</ul>
</nav>

<div class="overlay-section" id="overlay">
<h1>India’s Biggest Storytellers</h1>
<p>Entertainment • Cricket • Culture</p>
</div>

<div class="metric" id="metric">
120M+ Monthly Reach
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.152.2/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.2/dist/gsap.min.js"></script>

<script>
let scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x000000, 50, 200);

let camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 1000);
camera.position.z = 60;

let renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);
document.body.appendChild(renderer.domElement);

// Lights
let ambient = new THREE.AmbientLight(0xffffff, 0.4);
scene.add(ambient);

let point = new THREE.PointLight(0xff9900, 2);
point.position.set(20,20,20);
scene.add(point);

// Video Texture
let video = document.createElement('video');
video.src = "hero.mp4";
video.loop = true;
video.muted = true;
video.play();

let videoTexture = new THREE.VideoTexture(video);
let videoMaterial = new THREE.MeshBasicMaterial({ map: videoTexture });
let videoGeometry = new THREE.PlaneGeometry(120, 70);
let videoMesh = new THREE.Mesh(videoGeometry, videoMaterial);
videoMesh.position.z = -100;
scene.add(videoMesh);

// Particle Field
let particlesGeometry = new THREE.BufferGeometry();
let count = 5000;
let positions = new Float32Array(count * 3);

for(let i=0;i<count*3;i++){
 positions[i] = (Math.random()-0.5)*400;
}

particlesGeometry.setAttribute('position', new THREE.BufferAttribute(positions,3));
let particlesMaterial = new THREE.PointsMaterial({
 color:0xff9900,
 size:0.6,
 transparent:true,
 opacity:0.8
});
let particles = new THREE.Points(particlesGeometry, particlesMaterial);
scene.add(particles);

// 3D Panels
function createPanel(text,zPos){
 let geometry = new THREE.BoxGeometry(20,10,2);
 let material = new THREE.MeshPhysicalMaterial({
  color:0x111111,
  metalness:0.5,
  roughness:0.2,
  transmission:0.8,
  transparent:true,
  opacity:0.9
 });
 let mesh = new THREE.Mesh(geometry, material);
 mesh.position.z = zPos;
 scene.add(mesh);

 let canvas = document.createElement("canvas");
 canvas.width = 1024;
 canvas.height = 512;
 let ctx = canvas.getContext("2d");
 ctx.fillStyle="#000";
 ctx.fillRect(0,0,1024,512);
 ctx.fillStyle="#ff9900";
 ctx.font="bold 100px Inter";
 ctx.textAlign="center";
 ctx.fillText(text,512,280);

 let texture = new THREE.CanvasTexture(canvas);
 material.map = texture;
}

createPanel("Entertainment",-30);
createPanel("Cricket",-60);
createPanel("Culture",-90);

// Scroll Adaptive Camera
window.addEventListener("scroll",()=>{
 let scrollY = window.scrollY;
 camera.position.z = 60 - scrollY * 0.08;

 if(scrollY > 200){
   document.getElementById("overlay").style.opacity=0;
 }

 if(scrollY > 600){
   document.getElementById("metric").style.opacity=1;
 }
});

// Mouse Interaction
document.addEventListener("mousemove",(e)=>{
 let x = (e.clientX/window.innerWidth - 0.5)*2;
 let y = (e.clientY/window.innerHeight - 0.5)*2;
 gsap.to(camera.rotation,{
   y:x*0.2,
   x:-y*0.1,
   duration:1
 });
});

// Animate
function animate(){
 requestAnimationFrame(animate);
 particles.rotation.y += 0.0008;
 renderer.render(scene,camera);
}
animate();

// Extend page height
document.body.style.height="400vh";

window.addEventListener("resize",()=>{
 renderer.setSize(window.innerWidth, window.innerHeight);
 camera.aspect=window.innerWidth/window.innerHeight;
 camera.updateProjectionMatrix();
});
</script>

</body>
</html>
