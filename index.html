<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jiostar — India’s Biggest Storytellers</title>

<style>
body { margin:0; overflow-x:hidden; background:#050507; color:white; font-family: 'Segoe UI', sans-serif;}
canvas { display:block; }

.overlay {
 position:fixed;
 top:0;
 width:100%;
 text-align:center;
 padding-top:18vh;
 z-index:10;
 pointer-events:none;
}

.overlay h1 {
 font-size:4vw;
 letter-spacing:3px;
 font-weight:600;
}

.overlay p {
 opacity:.6;
 margin-top:15px;
 font-size:1.2vw;
}

.metric {
 position:fixed;
 bottom:8vh;
 width:100%;
 text-align:center;
 font-size:2vw;
 opacity:0;
 transition:all 1.2s ease;
}

.metric.show { opacity:1; }
</style>
</head>
<body>

<div class="overlay">
 <h1>India’s Biggest Storytellers</h1>
 <p>Entertainment • Cricket • Culture</p>
</div>

<div class="metric" id="metric">
  120M+ Monthly Reach
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.152.2/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.2/dist/gsap.min.js"></script>

<script>
let scene = new THREE.Scene();

let camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 2000);
camera.position.z = 40;

let renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);
document.body.appendChild(renderer.domElement);

// Lighting
let ambient = new THREE.AmbientLight(0xffffff, 0.4);
scene.add(ambient);

let pointLight = new THREE.PointLight(0xffa500, 1.5);
pointLight.position.set(20,20,20);
scene.add(pointLight);

// Particle Field
let particles = new THREE.BufferGeometry();
let count = 6000;
let positions = new Float32Array(count * 3);

for(let i=0;i<count*3;i++){
 positions[i] = (Math.random() - 0.5) * 400;
}

particles.setAttribute('position', new THREE.BufferAttribute(positions,3));

let material = new THREE.PointsMaterial({
 color:0xffa500,
 size:0.7,
 transparent:true,
 opacity:0.8
});

let points = new THREE.Points(particles, material);
scene.add(points);

// Glass Panel Creator
function createGlassPanel(text, xPos) {

 let geometry = new THREE.BoxGeometry(14,6,0.5);

 let material = new THREE.MeshPhysicalMaterial({
   color:0x111111,
   metalness:0.3,
   roughness:0.1,
   transmission:0.8,
   thickness:1,
   transparent:true,
   opacity:0.7
 });

 let mesh = new THREE.Mesh(geometry, material);
 mesh.position.set(xPos,0,-30);
 scene.add(mesh);

 // Canvas texture text
 let canvas = document.createElement("canvas");
 canvas.width = 1024;
 canvas.height = 512;
 let ctx = canvas.getContext("2d");
 ctx.fillStyle="#000";
 ctx.fillRect(0,0,1024,512);
 ctx.fillStyle="#ff9900";
 ctx.font="bold 100px Segoe UI";
 ctx.textAlign="center";
 ctx.fillText(text,512,280);

 let texture = new THREE.CanvasTexture(canvas);
 material.map = texture;

 return mesh;
}

let panel1 = createGlassPanel("Entertainment",-25);
let panel2 = createGlassPanel("Cricket",0);
let panel3 = createGlassPanel("Culture",25);

// Scroll Camera Movement
window.addEventListener("scroll",()=>{
 let scrollY = window.scrollY;
 camera.position.z = 40 - scrollY * 0.08;
 camera.position.x = scrollY * 0.02;

 if(scrollY > 200){
   document.getElementById("metric").classList.add("show");
 }
});

// Mouse Interaction
document.addEventListener("mousemove",(e)=>{
 let mouseX = (e.clientX - window.innerWidth/2)*0.002;
 let mouseY = (e.clientY - window.innerHeight/2)*0.002;

 gsap.to(camera.position,{
   x:mouseX*15,
   y:-mouseY*10,
   duration:1
 });
});

// Animate
function animate(){
 requestAnimationFrame(animate);

 points.rotation.y += 0.0007;
 panel1.rotation.y += 0.002;
 panel2.rotation.y -= 0.002;
 panel3.rotation.y += 0.002;

 renderer.render(scene,camera);
}

animate();

window.addEventListener("resize",()=>{
 renderer.setSize(window.innerWidth, window.innerHeight);
 camera.aspect = window.innerWidth/window.innerHeight;
 camera.updateProjectionMatrix();
});
</script>

</body>
</html>
