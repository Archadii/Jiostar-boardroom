<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jiostar Cinematic Narrative V4</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;500;700&display=swap" rel="stylesheet">

<style>
body {
  margin:0;
  overflow-x:hidden;
  background:#050507;
  color:white;
  font-family:'Inter',sans-serif;
}

canvas { display:block; }

nav{
 position:fixed;
 top:0;
 width:100%;
 padding:20px 40px;
 display:flex;
 justify-content:space-between;
 backdrop-filter:blur(8px);
 background:rgba(0,0,0,0.35);
 z-index:20;
}

nav img{ height:40px; }

.overlay-title{
 position:fixed;
 top:50%;
 width:100%;
 text-align:center;
 transform:translateY(-50%);
 pointer-events:none;
 z-index:10;
}

.overlay-title h1{
 font-size:4vw;
}

.info-panel{
 position:fixed;
 bottom:-100%;
 left:0;
 width:100%;
 height:60%;
 background:rgba(0,0,0,0.9);
 backdrop-filter:blur(20px);
 padding:60px;
 box-sizing:border-box;
 transition:bottom 0.6s ease;
 z-index:30;
}

.info-panel.active{
 bottom:0;
}

.info-panel h2{
 font-size:2.5vw;
 margin-bottom:20px;
}

.close-btn{
 position:absolute;
 top:20px;
 right:40px;
 cursor:pointer;
 font-size:18px;
}

body{ height:400vh; }
</style>
</head>

<body>

<nav>
<img src="https://www.jiostar.com/assets/images/Logo.svg">
</nav>

<div class="overlay-title">
<h1>India’s Biggest Storytellers</h1>
</div>

<div class="info-panel" id="infoPanel">
<div class="close-btn" onclick="closePanel()">Close ✕</div>
<h2 id="panelTitle"></h2>
<p>
Lorem ipsum dolor sit amet, consectetur adipiscing elit. 
Sed do eiusmod tempor incididunt ut labore et dolore magna aliqua.
Ut enim ad minim veniam, quis nostrud exercitation ullamco laboris.
</p>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.152.2/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.2/dist/gsap.min.js"></script>

<script>

const PINK = 0xff007f;
let scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x050507, 40, 150);

let camera = new THREE.PerspectiveCamera(60,window.innerWidth/window.innerHeight,0.1,1000);
camera.position.z = 60;

let renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(window.innerWidth,window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);
document.body.appendChild(renderer.domElement);

let ambient = new THREE.AmbientLight(0xffffff,0.5);
scene.add(ambient);

let light = new THREE.PointLight(PINK,2);
light.position.set(20,20,20);
scene.add(light);

/* PARTICLES */
let particleCount = 1200;
let geometry = new THREE.BufferGeometry();
let positions = new Float32Array(particleCount*3);
let radii = [];

for(let i=0;i<particleCount;i++){
 let angle = Math.random()*Math.PI*2;
 let radius = 30+Math.random()*40;
 let height = (Math.random()-0.5)*50;
 positions[i*3]=Math.cos(angle)*radius;
 positions[i*3+1]=height;
 positions[i*3+2]=Math.sin(angle)*radius;
 radii.push(radius);
}
geometry.setAttribute('position',new THREE.BufferAttribute(positions,3));

let material = new THREE.PointsMaterial({
 color:PINK,
 size:1.2,
 transparent:true,
 opacity:0.85,
 depthWrite:false
});

let particles = new THREE.Points(geometry,material);
scene.add(particles);

/* PANELS */
let panels=[];
function createPanel(text,x,z){
 let geo=new THREE.BoxGeometry(20,10,1);
 let mat=new THREE.MeshPhysicalMaterial({
  color:0x111111,
  metalness:0.7,
  roughness:0.1,
  transmission:0.9,
  transparent:true,
  opacity:0.95
 });
 let mesh=new THREE.Mesh(geo,mat);
 mesh.position.set(x,0,z);
 mesh.userData.title=text;
 scene.add(mesh);

 let canvas=document.createElement("canvas");
 canvas.width=1024; canvas.height=512;
 let ctx=canvas.getContext("2d");
 ctx.fillStyle="#000";
 ctx.fillRect(0,0,1024,512);
 ctx.fillStyle="#ff007f";
 ctx.font="bold 90px Inter";
 ctx.textAlign="center";
 ctx.fillText(text,512,280);

 let texture=new THREE.CanvasTexture(canvas);
 mat.map=texture;

 panels.push(mesh);
}

createPanel("Entertainment",-25,-30);
createPanel("Sports",0,-50);
createPanel("Culture",25,-70);

/* RAYCAST */
let raycaster=new THREE.Raycaster();
let mouse=new THREE.Vector2();
let zoomed=false;

window.addEventListener("click",(event)=>{
 if(zoomed) return;

 mouse.x=(event.clientX/window.innerWidth)*2-1;
 mouse.y=-(event.clientY/window.innerHeight)*2+1;

 raycaster.setFromCamera(mouse,camera);
 let intersects=raycaster.intersectObjects(panels);

 if(intersects.length>0){
  let target=intersects[0].object;
  zoomed=true;
  document.body.style.overflow="hidden";

  gsap.to(camera.position,{
   x:target.position.x,
   y:target.position.y,
   z:target.position.z+15,
   duration:1.2,
   ease:"power3.inOut"
  });

  document.getElementById("panelTitle").innerText=target.userData.title;
  document.getElementById("infoPanel").classList.add("active");
 }
});

function closePanel(){
 zoomed=false;
 document.body.style.overflow="auto";
 document.getElementById("infoPanel").classList.remove("active");

 gsap.to(camera.position,{
  x:0,y:0,z:60,
  duration:1.2,
  ease:"power3.inOut"
 });
}

/* SCROLL EASE */
let targetZ=60;
window.addEventListener("scroll",()=>{
 if(!zoomed){
  targetZ=60-window.scrollY*0.05;
 }
});

/* MOUSE PARALLAX */
document.addEventListener("mousemove",(e)=>{
 if(zoomed) return;
 let x=(e.clientX/window.innerWidth-0.5)*2;
 let y=(e.clientY/window.innerHeight-0.5)*2;
 camera.rotation.y=x*0.15;
 camera.rotation.x=-y*0.08;
});

/* ANIMATE */
function animate(){
 requestAnimationFrame(animate);

 if(!zoomed){
  camera.position.z+= (targetZ-camera.position.z)*0.08;
 }

 let pos=particles.geometry.attributes.position.array;
 for(let i=0;i<particleCount;i++){
  let angle=performance.now()*0.00012+i;
  pos[i*3]=Math.cos(angle*0.2)*radii[i];
  pos[i*3+2]=Math.sin(angle*0.2)*radii[i];
 }
 particles.geometry.attributes.position.needsUpdate=true;

 renderer.render(scene,camera);
}
animate();

window.addEventListener("resize",()=>{
 renderer.setSize(window.innerWidth,window.innerHeight);
 camera.aspect=window.innerWidth/window.innerHeight;
 camera.updateProjectionMatrix();
});

</script>

</body>
</html>
